name: Quick CI Test

on:
  push:
    branches: [ "main" ]

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: build Docker Image
        run: Docker build -t my-app:latest .  

      - name: Run Docker Container
        run: Docker run -d -p 8080:80 --name test-container my-app:latest