name: Quick CI Test

on:
  push:
    branches: [ "main" ]

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: build Docker Image
        run: docker build -t my-app:latest .  

      - name: Print Success Message
        run: echo "Automation successfully triggered on GitHub!"