name: Quick CI Test

on:
  push:
    branches: [ "main" ]

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: build and run docker compose stack
        run: docker compose up -d 

      - name: wait for web service to be ready
        run: sleep 5

      - name: check running containers
        run: docker ps
        
      - name: verify web service response
        run: curl -fail http://localhost:8080 || exit 1  

      - name: tear down stack
        run: docker compose down
